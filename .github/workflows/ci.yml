name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab; also runs the live job

permissions:
  contents: read

env:
  # Where fastembed keeps the local embedding model (~70 MB), so CI can cache it.
  FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache

jobs:
  test:
    # Uses the scripted fake model: no secrets, no API cost, deterministic.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5
      - name: Install dependencies (exactly as locked)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -v

  live-smoke:
    # Only when started by hand, so a paid API call never runs on every push.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    # Authenticates with Workload Identity Federation: no API key stored in GitHub.
    permissions:
      contents: read
      id-token: write # lets this job ask GitHub for a signed OIDC identity token
    env:
      # IDs, not secrets: set them under Settings > Secrets and variables > Actions > Variables.
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-oidc.jwt
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --locked
      - name: Fetch GitHub OIDC token
        # GitHub's token expires after ~5 minutes, so fetch it right before it's used.
        # The Anthropic SDK swaps it for a short-lived Claude token on the first request.
        run: |
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
      - name: Live smoke test against Claude
        run: uv run pytest -m live -v
